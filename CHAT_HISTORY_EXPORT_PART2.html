caller, and a CLOSE update when settlement is confirmed. Reuse the single central settlement function from the main bug-fix prompt so there is exactly one place where closes are recorded.\n2. Attribution comes from the ledger's `strategy` column, not from comment substrings, hardcoded asset IDs, or in-memory placed_position_ids. Delete those heuristics. Keep one fallback only for broker trades missing from the ledger (e.g. manual trades): label them \"Manual/Unattributed\" rather than guessing.\n3. Reconcile with broker history:\n   - Pull broker history across ALL endpoints (cfd/forex/crypto) with pagination (not a single limit=50).\n   - Ledger rows with pnl NULL get filled from broker history when found.\n   - Broker closed trades missing from the ledger are inserted as \"Manual/Unattributed\".\n   - Use the failure-aware client from the main prompt: if the broker call fails or is rate-limited, show ledger data and add a \"broker sync incomplete\" note. Never silently show partial data.\n4. Presentation:\n   - Newest first. Show date and time (UTC, with the display timezone configurable) instead of HH:MM only.\n   - Treat multi-leg trades (Trendline 2 legs, gold 2 tickets) as ONE trade (aggregate by group_id) in counts, win rate and profit factor, with legs shown beneath on request.\n   - Filters via inline buttons: strategy (all engines listed above + Blitz + Manual), period (Today / 7d / 30d / All), and pagination (Prev/Next).\n   - Per-strategy and overall stats: PnL, win rate, profit factor, average win/loss, max drawdown, count. Keep Blitz stats separate from CFD stats in the global totals.\n   - Label a trade BREAKEVEN only when confirmed pnl == 0; show \"pending settlement\" for NULL pnl.\n   - Handle Telegram's 4096-character message limit (split or paginate) and the existing Markdown-failure fallback.\n   - Add `/export` that sends the ledger (filtered by period/strategy) as a CSV file.\n5. Tests: attribution survives a bot restart; multi-leg trades aggregate as one; broker-only trades appear as Manual; pagination and the filters work; a rate-limited broker call shows the incomplete-sync note.\n\n## ADDENDUM B: Make prop-firm mode (bot/prop_firm_manager.py) enforce real risk rules\n\nCurrent problems to fix:\n- `_compute_asset_prop_lots` ignores risk_usd and always returns 1.0 lot (2.0 for gold). The configured 0.75% risk per trade is never applied, and single trades have lost $329 to $363 against a 4% (~$200) daily limit.\n- Drawdown limits check closed-trade balance only, not floating equity.\n- max_open_positions=2 counts legs/tickets, so Trendline and gold legs block every other strategy (all Callisto signals were rejected).\n- Balance and PnL are a bot-side tally that drifted from the broker, and \"PASSED\" fired without broker confirmation.\n\nRequired changes:\n1. **Risk-based sizing.** Compute lots from risk_usd using the actual stop distance for each trade (pass stop-loss distance in points/pips into can_execute_trade, and use per-instrument pip/contract values and the broker's min/step lot size). Never exceed risk_usd. If the minimum lot would exceed the risk budget, reject the trade with a clear reason instead of oversizing. Apply this to ALL engines and copiers so none bypass the guardian. Rule-based, configurable constants.\n2. **Equity-based enforcement.** Every N seconds (default 30), and before each new trade, compute equity = balance + floating PnL of open positions from the broker (using the cached, rate-limit-aware client). Daily-loss and max-drawdown checks use equity. When a daily or max limit is breached, flatten all positions immediately and lock trading; do not wait for the next closed trade. Also add a \"buffer\" setting (e.g. lock at 80% of the daily limit) so the bot never touches the real limit.\n3. **Projected-loss check before entry.** Reject any new trade whose worst-case loss at its stop would push (daily loss + open risk + this trade's risk) beyond the limit. Include risk already committed by open positions.\n4. **Concurrency by risk, not legs.** Replace max_open_positions with (a) a max number of open TRADES (legs aggregated by group_id) and (b) a max total open risk % (e.g. 1.5%). Make both configurable.\n5. **Broker reconciliation.** Persist processed_trade_ids and all state atomically (write to a temp file then rename). On startup and every 15 minutes, compare tracked balance to the broker balance, alert on drift above a threshold, and re-sync the baseline. Do not mark the challenge PASSED until the broker balance confirms the target, and do not trust a PnL that is NULL/unconfirmed.\n6. **Configurable rules.** Move the hardcoded constants (target % per phase, daily DD %, max DD %, risk per trade %, daily trade cap, consecutive-loss breaker, day-reset time and timezone, static vs trailing max drawdown) into a config object or env settings, with sensible defaults for a $5,000 two-phase challenge. The daily reset boundary must match the evaluation firm's day definition.\n7. **Better dashboard and alerts** (`get_dashboard_text`): show equity vs balance, distance to the daily limit and the max-drawdown floor in $ and %, distance to target, open risk, trades today vs cap, per-strategy contribution to the challenge PnL, and the last reconciliation status. Alert when daily loss reaches 50% and 80% of its limit.\n8. **Consistency.** All closures (every engine, manual closes, close-all) must flow through the single central settlement function, so the guardian sees every trade exactly once.\n9. Tests: lots never exceed the risk budget; a deep floating loss triggers a flatten-and-lock before the closed PnL changes; legs aggregate in concurrency checks; state survives a restart with no double-counting; PASSED is blocked when the broker balance is below the target.\n\n## ADDENDUM C: Add multi-timeframe confirmation to SNDEngine and TrendlineEngine\n\nContext: strategies/snd_engine.py and strategies/trendline_engine.py currently trade off a single 15-minute candle series (CANDLE_SIZE = 900 / size=900) with no higher-timeframe context. strategies/crt_engine.py already fetches both 5-minute (size=300) and 1-hour (size=3600) candles and uses them together — use that as the reference pattern for how get_candles(asset_id, count, size) is called and cached.\n\nGoal: before taking a 15-minute entry signal, confirm it against 1-hour structure and 4-hour trend bias. Do not change the 15-minute entry/trigger logic itself — only gate it.\n\n1. **Add a shared multi-timeframe helper** (new module, e.g. strategies/mtf_context.py) with one function per engine to call, e.g. `get_bias(symbol, asset_id) -> {\"h4_trend\": \"UP\"/\"DOWN\"/\"RANGE\", \"h1_trend\": \"UP\"/\"DOWN\"/\"RANGE\", \"h4_candles\":[...], \"h1_candles\":[...]}`.\n   - Fetch 4-hour candles (size=14400) and 1-hour candles (size=3600) via self.mcp.get_candles, same client used today.\n   - Trend detection, default method (simplest, implement this first): calculate EMA20 and EMA50 on each timeframe's closes. UP when EMA20 > EMA50 and the gap has widened over the last few candles; DOWN when EMA20 < EMA50 and the gap has widened the other way; RANGE when the two are close together with no clear widening gap.\n   - Alternative method (only build if the EMA version proves too choppy in backtesting): detect swing highs/lows over the recent window; UP when swing highs and swing lows are both rising, DOWN when both are falling, RANGE when mixed. This needs swing-point detection logic first, so treat it as a fallback, not the first implementation.\n   - Cache each timeframe's result for a few minutes (4H and 1H candles don't change every tick) to avoid adding load to the already rate-limited MCP client from the main bug-fix prompt — reuse that prompt's shared rate limiter/cache rather than adding a second one.\n\n2. **Gate SNDEngine entries:** in the function that currently decides to open a new S&D zone/trade on the 15M signal, only proceed if:\n   - h4_trend agrees with t y), [`kingmahn_copier.py`](file:///sdcard/Documents/AGY%20Files/BreakingBadV3/copiers/kingmahn_copier.py)).\n\n#### 2. PnL defaults to $0.00 when history lookup fails\n- **Root Cause**: `_log_trade_closure` initialized `pnl = 0.0`. If history queries failed or returned empty results, the trade was announced as `[S&D BREAKEVEN] $0.00`.\n- **Fix**:\n  - In [`strategies/snd_engine.py`](file:///sdcard/Documents/AGY%20Files/BreakingBadV3/strategies/snd_engine.py#L673-L710): Initialized `pnl = None`. If history lookup fails, the trade is queued in `self._pending_settlements` and no false card is broadcast. A trade is only labeled `BREAKEVEN` when history explicitly confirms `pnl == 0.0`.\n  - Replicated across `trendline_engine.py` and [`bot/telegram_controller.py`](file:///sdcard/Documents/AGY%20Files/BreakingBadV3/bot/telegram_controller.py#L1620-L1634).\n\n#### 3. PropFirmGuardian misses S&D and engine closures\n- **Root Cause**: `PropFirmGuardian.on_trade_closed` was only invoked from `TelegramController._cleanup_closed_trade`. S&D and other autonomous engines performed their own closures without calling the guardian.\n- **Fix**:\n  - In `TelegramTradingBot.__init__`: Linked `self.prop_guardian` to all engines and copiers.\n  - In `snd_engine._log_trade_closure`, `trendline_engine._log_ticket_closure`, `ict_engine`, and `crt_engine`: Added calls to `self.prop_guardian.on_trade_closed` with confirmed PnL.\n  - Added idempotency via `self.processed_trade_ids` and persisted it in `save_state`/`load_state` in [`bot/prop_firm_manager.py`](file:///sdcard/Documents/AGY%20Files/BreakingBadV3/bot/prop_firm_manager.py#L106-L144).\n  - Added `reconcile_with_broker(drift_threshold=25.0)` and guarded \"CHALLENGE PASSED\" to require broker equity confirmation.\n\n#### 4. Shared Rate Limiter & Token-Bucket Backoff\n- **Root Cause**: Multiple engines concurrently called IQ Option MCP endpoints without global rate tracking, exceeding the 60 calls/min limit.\n- **Fix**:\n  - Implemente what do you know about sessional analysis"}, {"role": "assistant", "time": "2026-10-18T22:45:10Z", "text": "**Sessional analysis** is the study of how liquidity, volatility, and orderflow rotate through the global 24-hour financial cycle as institutional money centers (banks, hedge funds, sovereign desks) open and close. \n\nIn institutional trading (and specifically **ICT / SMC / Market Profile**), price does not move randomly across the day—it follows a repeating **algorithmic cycle of Accumulation, Manipulation, and Distribution (AMD)** tied directly to global banking hours.\n\n---\n\n### 1. The 3 Major Institutional Sessions\n\n```\n  00:00 UTC        07:00 UTC            12:00 UTC       16:00 UTC       21:00 UTC\n┌────────────────┬────────────────────┬───────────────┬───────────────┬─────────┐\n│  ASIAN SESSION │    LONDON OPEN     │   NY OVERLAP  │  LONDON CLOSE │ DEAD/   │\n│ (Accumulation) │   (Manipulation)   │ (Distribution)│  (Profit Take)│ ROLLOVER│\n└────────────────┴────────────────────┴───────────────┴───────────────┴─────────┘\n```\n\n#### **A. Asian Session (Tokyo / Sydney / Hong Kong: ~00:00 – 06:00 UTC)**\n* **Market Behavior**: Low volume, tight range, sideways consolidation.\n* **Institutional Purpose (Accumulation)**: Market makers accumulate orders while retail traders place stop-losses just above the **Asian High** and below the **Asian Low**.\n* **Key Assets**: JPY, AUD, NZD. On Gold (`XAUUSD`) and EUR/GBP, it typically establishes liquidity boundaries that will be hunted later.\n\n#### **B. London Session (~07:00 – 12:00 UTC) — *The Highest Volume FX Hub***\n* **Market Behavior**: Explosive expansion and volatility injection.\n* **Institutional Purpose (Manipulation — The \"Judas Swing\")**:\n  * Around **07:00 – 08:30 UTC**, algorithms engineer a false breakout past the Asian High or Asian Low.\n  * This sweeps retail stop orders and triggers breakout traders into the wrong direction.\n  * Once liquidity is filled, the smart money reverses price, frequently forming the **High of the Day (HOD)** or **Low of the Day (LOD)** (occurring ~70% of days in London).\n* **Key Assets**: EUR, GBP, Gold, DAX.\n\n#### **C. New York Session (~12:00 – 20:00 UTC)**\n* **Market Behavior**: High-impact macro news drivers (CPI, PPI, NFP, FOMC at 12:30 / 14:00 UTC).\n* **Two Dominant Regimes**:\n  1. **London Continuation**: If London established a strong institutional trend, New York pulls back into a Fair Value Gap (FVG) or Order Block during the London/NY Overlap (12:00–16:00 UTC) and continues the trend.\n  2. **NY Reversal**: If London hit an institutional Daily/H4 higher-timeframe HTF Key Level (S&D zone or Daily liquidity), NY creates a reversal back into the daily range.\n* **Key Assets**: USD pairs, Gold, US Indices (NAS100, US30, S&P 500), Crypto.\n\n---\n\n### 2. Core Concepts & Models in Sessional Analysis\n\n1. **The London Judas Swing**:\n   * Asian Low swept $\\rightarrow$ Reclaimed $\\rightarrow$ Market Structure Shift (MSS) $\\rightarrow$ Enter Long targeting Asian High + external liquidity.\n2. **Session Initial Balance (IB) & Session Anchoring**:\n   * In Candle Range Theory (CRT) and Market Profile, the high and low of the first 60 minutes of a session define the \"Initial Balance\". Breaking this range with volume predicts the trend for the remainder of the session.\n3. **Session Killzones**:\n   * Strict algorithmic execution windows:\n     * **Asian Killzone**: 00:00 – 02:00 UTC\n     * **London Open Killzone**: 07:00 – 10:00 UTC\n     * **New York AM Killzone**: 12:00 – 15:00 UTC\n     * **London Close Killzone**: 15:00 – 17:00 UTC (frequent counter-trend retracements as European desks close book positions)\n4. **The \"Dead Zone\" / Asian Rollover (~21:00 – 23:00 UTC)**:\n   * Broker spreads widen massively (spread blowout), liquidity evaporates, and volume drops to near zero. Algorithms should **never** take fresh entries during this period.\n\n---\n\n### 3. How Sessional Analysis Directly Applie
